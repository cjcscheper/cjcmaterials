# cjcmaterials material file; syntax and field order: material_template.yaml in the repository root.
name: Al
note: >-
  Aluminium (bulk). Ported from optpumpthz (Al), whose free-electron Drude description is replaced
  by the Rakic (1998) Lorentz-Drude model and whose placeholder optical table (n = 1.5, k = 0) by
  the Rakic (1995) table. The Drude term's carrier_density is an effective density N m_e / m*, not
  the electron density of the metal (see the description); a carrier_density passed at use time
  replaces it.
sources:
  rakic1998:
    type: doi
    id: 10.1364/AO.37.005271
    citation: >-
      A. D. Rakić, A. B. Djurišić, J. M. Elazar, M. L. Majewski, Optical properties of metallic films
      for vertical-cavity optoelectronic devices, Appl. Opt. 37, 5271-5283 (1998)
    location: >-
      Table 1 (omega_p) and Table 2 (LD model parameters), column Al. Sec. 3D: fitted to the
      Rakic (1995) data (6.2 meV-10 keV); the fit range is not given, the paper's range is 0.1-6 eV.
      The range here, 0.005-20 eV, is that of the refractiveindex.info script (polyanskiy2024)
    valid_range_thz: [[1.21, 4835]]
    checked: "C. Scheper, 2026-10-27"
  rakic1995:
    type: doi
    id: 10.1364/AO.34.004755
    citation: >-
      A. D. Rakić, Algorithm for the determination of intrinsic optical constants of metal films:
      application to aluminum, Appl. Opt. 34, 4755-4767 (1995)
    location: >-
      n, k at 0.000124-200 um (refractiveindex.info export, polyanskiy2024; the table or figure in
      the paper to be located exactly)
    valid_range_thz: [[1.5, 2.4e6]]
    checked: "C. Scheper, 2026-10-27"
  polyanskiy2024:
    type: doi
    id: 10.1038/s41597-023-02898-2
    citation: >-
      M. N. Polyanskiy, "Refractiveindex.info database of optical constants", Sci. Data 11, 94
      (2024)
    location: >-
      refractiveindex.info database, Al: the Rakic (1995) n, k data (0.000124-200 um), exported as
      Al_Rakic1995.csv, and the Python implementation of the Rakic et al. (1998) Lorentz-Drude model
      (M. N. Polyanskiy, 2017; 0.005-20 eV), used to evaluate rakic1995 and rakic1998
    valid_range_thz: [[1.21, 2.4e6]]
    checked: "C. Scheper, 2026-10-27"
descriptions:
  - label: lorentz_drude
    model: drude_lorentz
    valid_range_thz: [[1.21, 4835]]
    sources: [rakic1998, polyanskiy2024]
    note: >-
      0.005-20 eV (1.209-4836 THz), bounds rounded inward: the range of the refractiveindex.info
      script, wider than the paper's 0.1-6 eV (see the source's location). In SI units: tau = hbar /
      Gamma_0 and each oscillator's strength = f_k omega_p^2 / omega_k^2; eps_inf = 1 is the
      paper's, since the interband part is in the oscillators. CARRIER DENSITY: the paper gives only
      the Drude plasma frequency Omega_p = sqrt(f_0) omega_p, not the electron density N and
      effective mass m* separately. With effective_mass_ratio = 1, carrier_density is the effective
      density N m_e / m* = Omega_p^2 eps0 m_e / e^2 that reproduces Omega_p; it is not the electron
      density of the metal, and a carrier_density passed at use time is read the same way. Below
      1.21 THz the fit is not backed by the paper (use description="lorentz_drude", which warns
      there).
    parameters:
      eps_inf: 1.0
      effective_mass_ratio: 1.0
      carrier_density: 8.51159e28          # effective N m_e/m*, f_0 = 0.523, omega_p = 14.98 eV
      scattering_time: 1.400451e-14        # Gamma_0 = 0.047 eV
      oscillators:                         # f_k, Gamma_k [eV], omega_k [eV]
        - {strength: 1940.97, resonance_omega: 2.461213e14, damping: 5.059161e14}   # 0.227, 0.333, 0.162
        - {strength: 4.70651, resonance_omega: 2.345749e15, damping: 4.740114e14}   # 0.050, 0.312, 1.544
        - {strength: 11.3955, resonance_omega: 2.746836e15, damping: 2.052530e15}   # 0.166, 1.351, 1.808
        - {strength: 0.55813, resonance_omega: 5.276416e15, damping: 5.138163e15}   # 0.030, 3.382, 3.473
  - label: optical
    model: tabulated
    valid_range_thz: [[1.5, 2.4e6]]
    sources: [rakic1995, polyanskiy2024]
    note: >-
      The full range of the table (0.000124-200 um, 1.499-2.418e6 THz), bounds rounded inward. It
      overlaps the Lorentz-Drude description at 1.5-4835 THz, where description= has to choose
      between them.
    parameters:
      file: Al_Rakic1995.csv
