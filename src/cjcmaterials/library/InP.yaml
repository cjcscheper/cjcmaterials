# cjcmaterials material file; syntax and field order: material_template.yaml in the repository root.
name: InP
note: >-
  Indium phosphide at room temperature. Ported from optpumpthz (InP_n and InP_p, now one material:
  the carrier type is chosen at use time).
sources:
  levinshtein1996:
    type: isbn
    id: 981-02-2934-8
    citation: >-
      M. Levinshtein, S. Rumyantsev, M. Shur (eds.), Handbook Series on Semiconductor Parameters,
      Vol. 1: Si, Ge, C (Diamond), GaAs, GaP, GaSb, InAs, InP, InSb, World Scientific (1996)
    location: InP chapter, high-frequency dielectric constant (to be located exactly)
    valid_range_thz: [[0.06, 21]]
    checked: no
  bennett1990:
    type: doi
    id: 10.1109/3.44924
    citation: >-
      B. R. Bennett, R. A. Soref, J. A. del Alamo, Carrier-induced change in refractive index of InP,
      GaAs and InGaAsP, IEEE J. Quantum Electron. 26, 113-122 (1990)
    location: effective masses of electrons and holes (to be located exactly)
    valid_range_thz: [[0.06, 21]]
    checked: no
  sotoodeh2000:
    type: doi
    id: 10.1063/1.372274
    citation: >-
      M. Sotoodeh, A. H. Khalid, A. A. Rezazadeh, Empirical low-field mobility model for III-V
      compounds applicable in device simulation codes, J. Appl. Phys. 87, 2890-2900 (2000)
    location: >-
      Table I, InP (electron: 5200, 400 cm^2/Vs, 3.0e17 cm^-3, 0.47; hole: 170, 10 cm^2/Vs, 4.87e17
      cm^-3, 0.62). Sec. IV C: electrons fitted to the Anderson et al. data at 1e15-5e19 cm^-3; for
      holes no density range is given (Fig. 7). Eq. (4) with T = 300 K. A DC (Hall) mobility of
      majority carriers in bulk, uncompensated material, independent of dopant and growth method;
      minority-carrier mobility is assumed equal to it, which the paper warns can be badly off; the
      Hall factor can reach 4 for low-doped p-type. Not for T below 100-150 K. The paper says
      nothing about frequency or about the Lorentz part: it supports only the mobility of the Drude
      term, and its range here is the description's, assuming the DC mobility holds at THz
      frequencies.
    valid_range_thz: [[0.06, 21]]
    checked: no
  alyabyeva2017:
    type: doi
    id: 10.1038/s41598-017-07164-1
    citation: >-
      L. N. Alyabyeva, E. S. Zhukova, M. A. Belkin, B. P. Gorshunov, Dielectric properties of
      semi-insulating Fe-doped InP in the terahertz spectral region, Sci. Rep. 7, 7360 (2017)
    location: >-
      Table 1 (Delta eps; nu and gamma in cm^-1, converted here to rad/s as omega = 2 pi c nu);
      spectra 2-700 cm^-1 at room temperature
    valid_range_thz: [[0.06, 21]]
    checked: no
  glembocki1985:
    type: isbn
    id: 0-12-544420-6
    citation: >-
      O. J. Glembocki, H. Piller, Indium Phosphide (InP), in E. D. Palik (ed.), Handbook of Optical
      Constants of Solids, Academic Press, Orlando (1985)
    location: p. 503, Table VIII (transcribed 0.2-2.8 um; k not tabulated beyond 0.975 um)
    valid_range_thz: [[308, 1498]]
    checked: no
descriptions:
  - label: thz
    model: drude_lorentz
    valid_range_thz: [[0.06, 21]]
    sources: [alyabyeva2017]
    note: >-
      Lattice (TO phonon at 304 cm^-1 and weak multi-phonon lines) from Alyabyeva 2017 on a
      background eps_inf from Levinshtein; free carriers as Drude with a Caughey-Thomas mobility.
      optpumpthz used this model only up to 6 THz; the oscillator fit covers 2-700 cm^-1.
    parameters:
      eps_inf: {value: 9.61, source: levinshtein1996}
      oscillators:                         # Alyabyeva 2017, Table 1: nu, gamma in cm^-1
        - {strength: 0.018, resonance_omega: 5.519e12, damping: 2.731e12}     # 29.3, 14.5
        - {strength: 0.006, resonance_omega: 1.194e13, damping: 2.166e12}     # 63.4, 11.5
        - {strength: 0.003, resonance_omega: 1.494e13, damping: 1.582e12}     # 79.3, 8.4
        - {strength: 0.004, resonance_omega: 1.654e13, damping: 2.072e12}     # 87.8, 11.0
        - {strength: 0.0014, resonance_omega: 2.545e13, damping: 6.78e11}     # 135.1, 3.6
        - {strength: 0.019, resonance_omega: 3.059e13, damping: 5.463e12}     # 162.4, 29.0
        - {strength: 0.004, resonance_omega: 3.589e13, damping: 1.319e12}     # 190.5, 7.0
        - {strength: 0.128, resonance_omega: 4.521e13, damping: 4.144e12}     # 240.0, 22.0
        - {strength: 2.714, resonance_omega: 5.730e13, damping: 1.32e11}      # 304.2, 0.7 (TO phonon)
        - {strength: 0.008, resonance_omega: 6.970e13, damping: 1.770e12}     # 370.0, 9.4
        - {strength: 0.011, resonance_omega: 7.425e13, damping: 3.522e12}     # 394.2, 18.7
        - {strength: 0.007, resonance_omega: 8.815e13, damping: 2.675e12}     # 468.0, 14.2
        - {strength: 0.0002, resonance_omega: 9.377e13, damping: 1.695e12}    # 497.8, 9.0
        - {strength: 0.0011, resonance_omega: 1.176e14, damping: 2.2415e12}   # 624.3, 11.9
        - {strength: 0.0003, resonance_omega: 1.182e14, damping: 6.03e11}     # 627.5, 3.2
        - {strength: 0.003, resonance_omega: 1.225e14, damping: 2.826e11}     # 650.3, 1.5
        - {strength: 0.0002, resonance_omega: 1.237e14, damping: 1.601e12}    # 656.7, 8.5
        - {strength: 0.0002, resonance_omega: 1.255e14, damping: 1.582e12}    # 666.3, 8.4
        - {strength: 0.00015, resonance_omega: 1.287e14, damping: 2.279e12}   # 683.2, 12.1
      electrons:
        effective_mass_ratio: {value: 0.075, source: bennett1990}
        mobility: {model: caughey_thomas, mu_min: 0.0400, mu_max: 0.5200, n_ref: 3.0e23, alpha: 0.47, source: sotoodeh2000}
      holes:
        effective_mass_ratio: {value: 0.42, source: bennett1990}
        mobility: {model: caughey_thomas, mu_min: 0.0010, mu_max: 0.0170, n_ref: 4.87e23, alpha: 0.62, source: sotoodeh2000}
  - label: optical
    model: tabulated
    valid_range_thz: [[308, 1498]]
    sources: [glembocki1985]
    note: Undoped InP; n is tabulated from 0.2 um to 2.8 um but k only up to 0.975 um, so the range ends there.
    parameters:
      file: InP_Glembocki1985.csv
